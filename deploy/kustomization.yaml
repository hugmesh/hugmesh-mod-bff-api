apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-backend
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
# First-party images now pull from the in-cluster GitLab container registry
# (registry.hugmesh.systems = the GitLab chart's hosts.domain default; project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the gitlab-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets).
images:
  - { name: hugmesh-systems/mod-bff-api, newName: registry.hugmesh.net/hugmesh/hugmesh-mod-bff-api, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
