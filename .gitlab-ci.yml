# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Centralized OWASP pen-test stage — the canonical, include-able hidden jobs
# (.pentest-sca / .pentest-dast-baseline) live in the generator repo so every
# onboarded repo shares ONE source of truth (SCA + the full DAST harness:
# authenticated ZAP + custom probes + nuclei). See memory: hugmesh-pentest-standard.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, build, pentest]

test:
  stage: test
  tags: [hugmesh-x86, privileged]
  # Spring Boot 4 upgrade: the full-context integration tests now run on
  # Testcontainers (a real per-class PostgreSQL via hugmesh-commons'
  # PostgresTestSupport), so this job needs a Docker daemon. Run Maven directly in a
  # maven image with a docker-in-docker SERVICE providing that daemon (mirrors the
  # federation exemplar, PR #43). This box's docker-java client also needs the API
  # version pinned via the JVM sysprop -Dapi.version=1.43 (DOCKER_API_VERSION does
  # NOT work) — supplied through MAVEN_OPTS. Ryuk is disabled (the ephemeral dind
  # tears everything down, so the resource-reaper is unnecessary).
  image: maven:3.9-eclipse-temurin-25
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    MAVEN_OPTS: "-Dapi.version=1.43"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    # hugmesh-commons + hugmesh-parent are PRIVATE (GitLab Maven registry),
    # resolved via the committed settings.xml authenticated by the GitLab
    # CI_JOB_TOKEN; -s settings.xml points Maven at the gitlab-maven group repo.
    - ./mvnw verify -B -s settings.xml
    # ANY TEST THAT REGENERATES A COMMITTED ARTEFACT PASSES BY REWRITING IT, and in a
    # throwaway CI workspace nobody ever sees the diff. OpenApiSpecDumpTest used to do exactly
    # that with src/main/resources/openapi/openapi.json: it wrote by default and asserted only
    # under an opt-in flag that nothing ever set, so the contract the ng-openapi-gen typed
    # clients and the docs pipeline consume drifted while the build stayed green. That test now
    # asserts by default; this line catches the NEXT such artefact without knowing what it is.
    # A clean tree after the build is the invariant; a dirty one means the build silently
    # disagreed with something that is checked in.
    - git diff --exit-code
      || { echo "BUILD REWROTE A COMMITTED FILE (see the diff above) — a test regenerated a checked-in artefact instead of asserting it. Regenerate locally and commit, or make that test assert."; exit 1; }
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 7 days

build:image:
  stage: build
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the HugMesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP pen-test jobs — MIGRATED to the centralized hidden jobs from the
# generator's pentest-stage include (above). The former inline `dependency-check`
# job is replaced by `pentest:sca` (extends .pentest-sca) so there is ONE source
# of truth for SCA, and `pentest:dast` adds the full authenticated-ZAP + probes +
# nuclei harness. Both are non-blocking (allow_failure) and run on the default
# branch + merge requests, mirroring this repo's existing security-job rules.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
