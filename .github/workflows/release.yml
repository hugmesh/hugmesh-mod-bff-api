name: Release

# Manually-triggered only. This workflow is intentionally inert (no `push`/
# `tags` trigger) until a human wires it up and flips it on.
#
# Adapted from this repo's `.gitlab-ci.yml` `build:image` job, which builds the
# service's container image (multi-stage Dockerfile, Maven package -> JRE
# runtime) and pushes it to the GitLab in-cluster registry. Here it instead
# publishes to GHCR.
#
# NOTE for whoever enables this: the Dockerfile's build stage resolves the
# PRIVATE `net.hugmesh:hugmesh-commons` artifact from the org's GitLab
# Maven Package Registry via `settings.xml`, authenticated with a GitLab
# CI_JOB_TOKEN (see settings.xml / Dockerfile comments). That token doesn't
# exist in GitHub Actions, so this build will fail to resolve that dependency
# until hugmesh-commons is published somewhere reachable from here (e.g. GitHub
# Packages) and the build-arg/secret plumbing below is updated to match.
on:
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/hugmesh-net/hugmesh-mod-bff-api

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # Mirrors the GitLab job's `--secret id=ci_job_token,env=CI_JOB_TOKEN`
      # private-dependency resolution. Populate CI_JOB_TOKEN / CI_API_V4_URL /
      # GITLAB_GROUP_ID as repo/org secrets+vars if the private Maven registry
      # dependency is still needed at build time; otherwise repoint
      # settings.xml at a reachable registry first.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          secrets: |
            ci_job_token=${{ secrets.CI_JOB_TOKEN }}
          build-args: |
            CI_API_V4_URL=${{ vars.CI_API_V4_URL }}
            GITLAB_GROUP_ID=${{ vars.GITLAB_GROUP_ID }}
